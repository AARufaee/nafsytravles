<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Packages — Nafsy Travels</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-full flex flex-col antialiased bg-white text-zinc-900">
  <div data-include="/partials/header.html"></div>

  <main class="flex-1 flex flex-col">
    <div class="mx-auto max-w-6xl px-6 py-16 w-full flex-1">
      <div class="mb-8">
        <h1 data-editable="packages.heading" class="text-3xl font-semibold text-brand-navy">Travel packages</h1>
        <p class="mt-2 text-brand-navy/60">
          <span data-editable="packages.description">Pick one to book, or</span> <a href="/request" class="underline">request something custom</a>.
        </p>
      </div>

      <div data-category-filters class="mb-8 flex flex-wrap items-center gap-2"></div>

      <div data-packages-list class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <p class="text-brand-navy/60">Loading packages…</p>
      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script type="module" src="/js/include-partials.js"></script>
  <script type="module" src="/js/pages/packages.js"></script>
  <script src="/js/edit-affordance.js" defer></script>
</body>
</html>
